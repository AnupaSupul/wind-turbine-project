<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
        </filter>
        <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ebf4ff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>
        <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0fdf4"/>
            <stop offset="100%" stop-color="#dcfce7"/>
        </linearGradient>
        <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#faf5ff"/>
            <stop offset="100%" stop-color="#f3e8ff"/>
        </linearGradient>
        <linearGradient id="grad-amber" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="100%" stop-color="#fef3c7"/>
        </linearGradient>
        <linearGradient id="grad-gray" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#f1f5f9"/>
        </linearGradient>
    </defs>
    <style>
        .title { font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
        .subtitle { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
        .text-left { text-anchor: start; }
        .label { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; text-anchor: middle; }
        .sublabel { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
        path { stroke: #94a3b8; stroke-width: 2; fill: none; }
        .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
        .animated-arrow { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 4; animation: dash 1s linear infinite; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
        </marker>
    </defs>
    <rect width="850" height="420" fill="#ffffff" rx="12" />
    <text x="210" y="40" font-size="18" font-weight="bold" font-family="sans-serif" fill="#1e293b" text-anchor="middle">CURRENT (Simulator)</text>
<rect x="50" y="70" width="320" height="70" rx="8" fill="url(#grad-blue)" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="210.0" y="104.0">liveSimulator.js</text>
<text class="subtitle" x="210.0" y="121.0">Software Mock</text>
<line x1="210" y1="140" x2="210" y2="200" class="arrow" />
<rect x="164.0" y="160.0" width="92" height="20" fill="white" rx="4" />
<text class="label" x="210.0" y="174.0">HTTP POST</text>
<rect x="50" y="200" width="320" height="70" rx="8" fill="url(#grad-green)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="210.0" y="234.0">Backend (Node.js + Express)</text>
<text class="subtitle" x="210.0" y="251.0">localhost:5000</text>
<line x1="210" y1="270" x2="210" y2="330" class="arrow" />
<rect x="50" y="330" width="320" height="60" rx="8" fill="url(#grad-amber)" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="210.0" y="365.0">MongoDB Atlas</text>
<line x1="370" y1="235" x2="470" y2="235" class="arrow" />
<rect x="378.0" y="225.0" width="84" height="20" fill="white" rx="4" />
<text class="label" x="420.0" y="239.0">← SAME →</text>
<text x="630" y="40" font-size="18" font-weight="bold" font-family="sans-serif" fill="#1e293b" text-anchor="middle">FUTURE (Real Hardware)</text>
<rect x="470" y="70" width="320" height="70" rx="8" fill="url(#grad-purple)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="630.0" y="104.0">ESP32-S3 Microcontroller</text>
<text class="subtitle" x="630.0" y="121.0">Real Hardware Over Wi-Fi</text>
<line x1="630" y1="140" x2="630" y2="200" class="arrow" />
<rect x="584.0" y="160.0" width="92" height="20" fill="white" rx="4" />
<text class="label" x="630.0" y="174.0">HTTP POST</text>
<rect x="470" y="200" width="320" height="70" rx="8" fill="url(#grad-green)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="630.0" y="234.0">Backend (Node.js + Express)</text>
<text class="subtitle" x="630.0" y="251.0">localhost:5000</text>
<line x1="630" y1="270" x2="630" y2="330" class="arrow" />
<rect x="470" y="330" width="320" height="60" rx="8" fill="url(#grad-amber)" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="630.0" y="365.0">MongoDB Atlas</text>
</svg>