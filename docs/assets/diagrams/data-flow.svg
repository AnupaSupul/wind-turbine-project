<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
        </filter>
        <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ebf4ff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>
        <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0fdf4"/>
            <stop offset="100%" stop-color="#dcfce7"/>
        </linearGradient>
        <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#faf5ff"/>
            <stop offset="100%" stop-color="#f3e8ff"/>
        </linearGradient>
        <linearGradient id="grad-amber" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="100%" stop-color="#fef3c7"/>
        </linearGradient>
        <linearGradient id="grad-gray" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#f1f5f9"/>
        </linearGradient>
    </defs>
    <style>
        .title { font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
        .subtitle { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
        .text-left { text-anchor: start; }
        .label { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; text-anchor: middle; }
        .sublabel { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
        path { stroke: #94a3b8; stroke-width: 2; fill: none; }
        .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
        .animated-arrow { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 4; animation: dash 1s linear infinite; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
        </marker>
    </defs>
    <rect width="800" height="420" fill="#ffffff" rx="12" />
    <rect x="50" y="50" width="180" height="70" rx="8" fill="url(#grad-blue)" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="140.0" y="84.0">Telemetry Generated</text>
<text class="subtitle" x="140.0" y="101.0">Sensors/Simulator</text>
<line x1="140" y1="120" x2="140" y2="170" class="arrow" />
<rect x="50" y="170" width="180" height="70" rx="8" fill="url(#grad-gray)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="140.0" y="204.0">HTTP POST</text>
<text class="subtitle" x="140.0" y="221.0">/api/telemetry</text>
<line x1="140" y1="240" x2="140" y2="290" class="arrow" />
<rect x="50" y="290" width="180" height="70" rx="8" fill="url(#grad-green)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="140.0" y="324.0">Backend Validation</text>
<text class="subtitle" x="140.0" y="341.0">Limits & Types</text>
<line x1="230" y1="325" x2="300" y2="325" class="arrow" />
<rect x="300" y="290" width="180" height="70" rx="8" fill="url(#grad-green)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="390.0" y="324.0">Power Calculation</text>
<text class="subtitle" x="390.0" y="341.0">V × I = W</text>
<line x1="390" y1="290" x2="390" y2="240" class="arrow" />
<rect x="300" y="170" width="180" height="70" rx="8" fill="url(#grad-amber)" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="390.0" y="204.0">MongoDB Persistence</text>
<text class="subtitle" x="390.0" y="221.0">Permanent Storage</text>
<line x1="480" y1="325" x2="550" y2="325" class="arrow" />
<rect x="550" y="290" width="180" height="70" rx="8" fill="url(#grad-green)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="640.0" y="324.0">Memory Cache Update</text>
<text class="subtitle" x="640.0" y="341.0">Latest Record</text>
<line x1="640" y1="290" x2="640" y2="240" class="arrow" />
<rect x="566.0" y="255.0" width="148" height="20" fill="white" rx="4" />
<text class="label" x="640.0" y="269.0">HTTP GET /latest</text>
<rect x="550" y="170" width="180" height="70" rx="8" fill="url(#grad-purple)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)" />
<text class="title" x="640.0" y="204.0">React Dashboard</text>
<text class="subtitle" x="640.0" y="221.0">Live Rendering</text>
</svg>