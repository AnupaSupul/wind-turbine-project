<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
        </filter>
        <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ebf4ff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>
        <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0fdf4"/>
            <stop offset="100%" stop-color="#dcfce7"/>
        </linearGradient>
        <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#faf5ff"/>
            <stop offset="100%" stop-color="#f3e8ff"/>
        </linearGradient>
        <linearGradient id="grad-amber" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="100%" stop-color="#fef3c7"/>
        </linearGradient>
        <linearGradient id="grad-gray" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#f1f5f9"/>
        </linearGradient>
    </defs>
    <style>
        .title { font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
        .subtitle { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
        .text-left { text-anchor: start; }
        .label { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; text-anchor: middle; }
        .sublabel { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
        path { stroke: #94a3b8; stroke-width: 2; fill: none; }
        .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
        .animated-arrow { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 4; animation: dash 1s linear infinite; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
        </marker>
    </defs>
    <rect width="900" height="280" fill="#ffffff" rx="12" />
    <rect x="50" y="100" width="180" height="80" rx="8" fill="url(#grad-purple)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)" />
<text x="140.0" y="119.0" font-size="20" text-anchor="middle">💻</text>
<text class="title" x="140.0" y="154.0">React Dashboard</text>
<text class="subtitle" x="140.0" y="171.0">Browser</text>
<line x1="230" y1="120" x2="380" y2="120" class="arrow" />
<rect x="195.0" y="110.0" width="220" height="20" fill="white" rx="4" />
<text class="label" x="305.0" y="124.0">GET /api/telemetry/latest</text>
<text class="sublabel" x="305.0" y="138.0">Every 200ms</text>
<rect x="380" y="80" width="180" height="120" rx="8" fill="url(#grad-green)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
<text x="470.0" y="119.0" font-size="20" text-anchor="middle">⚙️</text>
<text class="title" x="470.0" y="154.0">Express Backend</text>
<text class="subtitle" x="470.0" y="171.0">Port 5000</text>
<line x1="560" y1="120" x2="680" y2="120" class="arrow" />
<rect x="594.0" y="110.0" width="52" height="20" fill="white" rx="4" />
<text class="label" x="620.0" y="124.0">Read</text>
<rect x="680" y="90" width="150" height="100" rx="8" fill="url(#grad-gray)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
<text x="755.0" y="119.0" font-size="20" text-anchor="middle">⚡</text>
<text class="title" x="755.0" y="154.0">Memory Cache</text>
<text class="subtitle" x="755.0" y="171.0">Fast Access</text>
<line x1="680" y1="160" x2="560" y2="160" class="arrow" />
<rect x="558.0" y="150.0" width="124" height="20" fill="white" rx="4" />
<text class="label" x="620.0" y="164.0">Latest Record</text>
<line x1="380" y1="160" x2="230" y2="160" class="arrow" />
<rect x="243.0" y="150.0" width="124" height="20" fill="white" rx="4" />
<text class="label" x="305.0" y="164.0">JSON Response</text>
</svg>